[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron"
version = "1.0.0"
description = "Monte Carlo fantasy football projection, simulation and draft-day engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # data
    "nflreadpy>=0.1",          # nflverse loaders (imported lazily in data/nflverse.py)
    "polars>=1.0",
    "pyarrow>=15",
    "requests>=2.31",
    "espn_api>=0.44",         # private-league reader (cwendt94/espn-api)
    # modelling
    "numpy>=1.26",
    "scipy>=1.11",
    # api + ui
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # exchange auth (Kalshi request signing)
    "cryptography>=42.0",
    "cffi>=1.16",
    # cli
    "rich>=13.0",
    "typer>=0.12",
    "segno>=1.6",             # QR pairing for phone access (pure python, no deps)
]

[project.optional-dependencies]
# CuPy is the preferred GPU path: it exposes NumPy's API, so the simulation
# code runs on it unchanged, and it installs far smaller than torch.
gpu = ["cupy-cuda12x>=13.0"]      # CUDA 12.x runtime
gpu-cuda11 = ["cupy-cuda11x>=13.0"]
gpu-torch = ["torch>=2.2"]        # fallback device backend
polymarket = ["py-clob-client>=0.17"]
dev = ["pytest>=8.0", "pytest-cov", "httpx"]

[project.scripts]
gridiron = "gridiron.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
