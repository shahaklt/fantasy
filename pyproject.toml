[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridiron"
version = "1.0.0"
description = "Monte Carlo fantasy football projection, simulation and draft-day engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # data
    "nflreadpy>=0.1",          # nflverse loaders (imported lazily in data/nflverse.py)
    "polars>=1.0",
    "pyarrow>=15",
    "requests>=2.31",
    # modelling
    "numpy>=1.26",
    "scipy>=1.11",
    # api + ui
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    # exchange auth (Kalshi request signing)
    "cryptography>=42.0",
    "cffi>=1.16",
    # cli
    "rich>=13.0",
    "typer>=0.12",
]

[project.optional-dependencies]
gpu = ["torch>=2.2"]
polymarket = ["py-clob-client>=0.17"]
dev = ["pytest>=8.0", "pytest-cov", "httpx"]

[project.scripts]
gridiron = "gridiron.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
